# #
#   @type               github workflow
#   @usage              build the web app and deploy it to GitHub Pages
#                       - can be activated manually
#                       - runs when the specified branches are pushed to
# #

run-name: '🌐 Pages › Deploy'
name: '🌐 Pages › Deploy'

# #
#   Triggers
# #

on:

    # #
    #   Trigger › Workflow Dispatch
    # #

    workflow_dispatch:

    # #
    #   Trigger › Push
    # #

    push:
        branches:
            - master
            - main

# #
#   Permissions
#
#   GITHUB_TOKEN needs write access to the pages resource so the deploy step
#   can create the deployment.
# #

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

# #
#   Jobs
# #

jobs:

    # #
    #   Jobs › Build & Deploy
    # #

    deploy:
        name: Build and deploy to GitHub Pages
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:

            # #
            #   Build › Checkout
            # #

            - name: 'Checkout'
              uses: actions/checkout@v4

            # #
            #   Build › Node › Setup
            # #

            - name: 'Setup › Node'
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            # #
            #   Build › NPM › Install
            # #

            - name: 'NPM › Install'
              run: |
                  npm ci

            # #
            #   Build › Grunt
            # #

            - name: 'Grunt › Build'
              run: |
                  NODE_OPTIONS=--openssl-legacy-provider grunt

            # #
            #   Deploy › Configure Pages
            # #

            - name: 'Configure Pages'
              id: configure
              uses: actions/configure-pages@v5

            # #
            #   Deploy › Upload Artifact
            # #

            - name: 'Upload Pages artifact'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            # #
            #   Deploy › Publish to GitHub Pages
            # #

            - name: 'Deploy to GitHub Pages'
              id: deployment
              uses: actions/deploy-pages@v4
